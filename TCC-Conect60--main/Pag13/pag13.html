<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONECT60+ - Login</title>
    <link rel="stylesheet" href="pag13.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
     
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Train+One&display=swap" rel="stylesheet">
</head>
<body>

    <header class="topbar">
        <div class="logo">CONECT60<span>+</span></div>
    </header>

    <main class="container">
        
        <div class="header-banner">
            <h1>Perfil do Idoso</h1>
        </div>

        <div class="profile-content">
            <div class="avatar-section">
                <div class="avatar-placeholder"><i class="bi bi-person-bounding-box"></i></div>
            </div>

            <div class="form-section">
                
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <div class="input-wrapper">
                        <input type="text" id="nome" class="form-control" placeholder="Digite seu nome completo">
                        <button type="button" class="btn-save">Salvar</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone para Contato</label>
                    <div class="input-wrapper">
                        <input type="tel" id="telefone" class="form-control" placeholder="(00) 00000-0000">
                        <button type="button" class="btn-save">Salvar</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="titulo">Senha</label>
                    <div class="input-wrapper">
                        <input type="text" id="titulo" class="form-control" placeholder="Senha">
                        <button type="button" class="btn-save">Trocar senha</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    </main>

</body>
</html>
