<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONECT60+ - Login</title>
    <link rel="stylesheet" href="pag11.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
     
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Train+One&display=swap" rel="stylesheet">
</head>
<body>

    <header class="topbar">
        <div class="logo">CONECT60<span>+</span></div>
    </header>

    <main class="main-container">
        
        <div class="login-card">
            <h2>Redefinir Senha</h2>
            
            <form action="#">
                <div class="input-group">
                    <i class="bi bi-telephone-fill"></i>
                    <input type="tel" placeholder="+55 Telefone" required>
                </div>

                <div class="input-group">
                    <i class="bi bi-eye-slash-fill"></i>
                    <input type="password" placeholder="Nova Senha" required>
                </div>

                <button type="submit" class="btn-submit">Alterar Senha</button>
            </form>
        </div>

    </main>

</body>
</html>
